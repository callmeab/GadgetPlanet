<div class="app-shell" [class.app-shell--admin]="isAdminRoute()">
  @if (!isAdminRoute()) {
    <gp-header></gp-header>
  }

  <main class="app-main" [class.app-main--admin]="isAdminRoute()" role="main">
    <router-outlet></router-outlet>
  </main>

  @if (!isAdminRoute()) {
    <gp-footer></gp-footer>
    <gp-cart-drawer></gp-cart-drawer>
  }
</div>
