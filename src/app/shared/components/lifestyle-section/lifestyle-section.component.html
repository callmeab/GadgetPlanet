<section class="lifestyle-section">
  <div class="container">

    <!-- Header Row -->
    <div class="section-header">
      <div class="title-wrap">
        <h2 class="section-title">{{ title }}</h2>
        <p class="section-subtitle">{{ subtitle }}</p>
      </div>

      <a routerLink="/products" class="section-link" id="lifestyle-view-all">
        Explore All Collections →
      </a>
    </div>

    <!-- 2x2 Responsive Banner Grid -->
    <div class="lifestyle-grid">
      @for (card of lifestyleCards; track card.id) {
        <a
          [routerLink]="card.ctaRoute"
          [queryParams]="card.ctaQueryParams"
          class="lifestyle-card"
          [id]="'lifestyle-card-' + card.id"
          [style.--card-accent]="card.accentColor"
        >
          <!-- Background Image with Zoom on Hover -->
          <div class="lifestyle-bg">
            <img
              [src]="card.image"
              [alt]="card.title"
              class="lifestyle-img"
              loading="lazy"
            />
            <div class="lifestyle-overlay"></div>
            <div class="lifestyle-ambient-glow"></div>
          </div>

          <!-- Content Overlay -->
          <div class="lifestyle-content">
            <div class="lifestyle-meta-top">
              <span class="lifestyle-tag">{{ card.tag }}</span>
              @if (card.badge) {
                <span class="lifestyle-badge">{{ card.badge }}</span>
              }
            </div>

            <div class="lifestyle-text">
              <h3 class="lifestyle-title">{{ card.title }}</h3>
              <p class="lifestyle-subtitle">{{ card.subtitle }}</p>
            </div>

            <div class="lifestyle-cta">
              <span class="cta-text">{{ card.ctaText }}</span>
              <span class="cta-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </span>
            </div>
          </div>
        </a>
      }
    </div>

  </div>
</section>
